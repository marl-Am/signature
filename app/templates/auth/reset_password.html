{% extends "base.html" %}

{% block title %}Reset Password — Signature{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">

    <div class="text-center">
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
        Choose a new password
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Must be at least 12 characters and include uppercase, digit, and
        a special character (@$!%*?&amp;).
      </p>
    </div>

    <form class="mt-8 space-y-6" method="POST"
          action="{{ url_for('auth.reset_password', token=token) }}">

      <div class="rounded-md shadow-sm space-y-4">

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            New password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="12"
            autocomplete="new-password"
            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300
                   rounded-md shadow-sm placeholder-gray-400 text-gray-900
                   focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="New password"
          />
        </div>

        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700">
            Confirm new password
          </label>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            required
            minlength="12"
            autocomplete="new-password"
            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300
                   rounded-md shadow-sm placeholder-gray-400 text-gray-900
                   focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="Confirm new password"
          />
        </div>

      </div>

      <div>
        <button
          type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent
                 text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700
                 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Reset password
        </button>
      </div>

    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Remembered it?
      <a href="{{ url_for('auth.login') }}"
         class="font-medium text-indigo-600 hover:text-indigo-500">
        Back to login
      </a>
    </p>

  </div>
</div>
{% endblock %}
