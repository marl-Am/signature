{% extends "base.html" %}
{% block title %}Server Error – Signature{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-br from-primary via-primary-dark to-primary flex items-center justify-center py-20 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">

      <div class="mb-6">
        <span class="text-8xl font-black text-primary">500</span>
      </div>

      <h1 class="text-2xl font-bold text-gray-800 mb-2">Something Went Wrong</h1>
      <p class="text-gray-500 mb-8">
        An unexpected error occurred on our end. Please try again in a moment.
      </p>

      <a href="{{ url_for('index') }}"
         class="inline-block w-full py-3 bg-primary text-white rounded-lg font-semibold text-lg hover:bg-primary-dark hover:shadow-xl transition-all">
        Back to Home
      </a>

      <div class="mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-primary font-semibold hover:underline text-sm">
          Go to Login
        </a>
      </div>

    </div>

    <div class="mt-8 text-center text-white/80 text-sm">
      <p>🔒 Your data is secure and encrypted</p>
    </div>
  </div>
</section>
{% endblock %}
