{% extends "base.html" %}
{% block title %}Profile — Signature{% endblock %}

{% block content %}
<div class="min-h-screen bg-primary py-12 px-4">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Page heading -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-white">Profile Settings</h1>
      <p class="text-white/60 mt-1">Manage your account details and security.</p>
    </div>

    <!-- ── Change Email ───────────────────────────────────────────── -->
    <div
      x-data="{ open: false }"
      class="bg-white/5 border border-white/10 rounded-xl overflow-hidden">

      <button
        @click="open = !open"
        class="w-full flex items-center justify-between px-6 py-5 text-left hover:bg-white/5 transition-colors">
        <div>
          <h2 class="text-lg font-semibold text-white">Change Email Address</h2>
          <p class="text-white/50 text-sm mt-0.5">
            Current: <span class="text-white/80">{{ current_user.email }}</span>
            {% if current_user.email_verified %}
              <span class="ml-2 text-green-400 text-xs font-medium">✓ Verified</span>
            {% else %}
              <span class="ml-2 text-yellow-400 text-xs font-medium">⚠ Unverified</span>
            {% endif %}
          </p>
        </div>
        <svg
          class="w-5 h-5 text-white/40 transition-transform"
          :class="open ? 'rotate-180' : ''"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div x-show="open" x-cloak class="px-6 pb-6 border-t border-white/10 pt-5">
        <form action="{{ url_for('profile.change_email') }}" method="POST" class="space-y-4">
          <div>
            <label for="ce_new_email" class="block text-sm font-medium text-white/80 mb-1">
              New Email Address
            </label>
            <input
              type="email"
              id="ce_new_email"
              name="new_email"
              required
              autocomplete="email"
              class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/50"/>
          </div>
          <div>
            <label for="ce_current_password" class="block text-sm font-medium text-white/80 mb-1">
              Confirm with Current Password
            </label>
            <input
              type="password"
              id="ce_current_password"
              name="current_password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/50"/>
          </div>
          <button
            type="submit"
            class="px-6 py-2.5 bg-white text-primary font-semibold rounded-lg hover:bg-white/90 transition-colors">
            Update Email
          </button>
        </form>
      </div>
    </div>

    <!-- ── Change Password ────────────────────────────────────────── -->
    <div
      x-data="{ open: false }"
      class="bg-white/5 border border-white/10 rounded-xl overflow-hidden">

      <button
        @click="open = !open"
        class="w-full flex items-center justify-between px-6 py-5 text-left hover:bg-white/5 transition-colors">
        <div>
          <h2 class="text-lg font-semibold text-white">Change Password</h2>
          <p class="text-white/50 text-sm mt-0.5">Choose a strong password with 12+ characters.</p>
        </div>
        <svg
          class="w-5 h-5 text-white/40 transition-transform"
          :class="open ? 'rotate-180' : ''"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div x-show="open" x-cloak class="px-6 pb-6 border-t border-white/10 pt-5">
        <form action="{{ url_for('profile.change_password') }}" method="POST" class="space-y-4">
          <div>
            <label for="cp_current" class="block text-sm font-medium text-white/80 mb-1">
              Current Password
            </label>
            <input
              type="password"
              id="cp_current"
              name="current_password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/50"/>
          </div>
          <div>
            <label for="cp_new" class="block text-sm font-medium text-white/80 mb-1">
              New Password
            </label>
            <input
              type="password"
              id="cp_new"
              name="new_password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/50"/>
          </div>
          <div>
            <label for="cp_confirm" class="block text-sm font-medium text-white/80 mb-1">
              Confirm New Password
            </label>
            <input
              type="password"
              id="cp_confirm"
              name="confirm_password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/50"/>
          </div>
          <button
            type="submit"
            class="px-6 py-2.5 bg-white text-primary font-semibold rounded-lg hover:bg-white/90 transition-colors">
            Update Password
          </button>
        </form>
      </div>
    </div>

    <!-- ── Delete Account ─────────────────────────────────────────── -->
    <div
      x-data="{ open: false, confirmed: false }"
      class="bg-red-500/10 border border-red-500/30 rounded-xl overflow-hidden">

      <button
        @click="open = !open"
        class="w-full flex items-center justify-between px-6 py-5 text-left hover:bg-red-500/10 transition-colors">
        <div>
          <h2 class="text-lg font-semibold text-red-400">Delete Account</h2>
          <p class="text-white/50 text-sm mt-0.5">Permanently remove your account and all data.</p>
        </div>
        <svg
          class="w-5 h-5 text-red-400/60 transition-transform"
          :class="open ? 'rotate-180' : ''"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div x-show="open" x-cloak class="px-6 pb-6 border-t border-red-500/20 pt-5">
        <p class="text-white/60 text-sm mb-4">
          This action is irreversible. All signatures, analytics data, and billing
          information will be permanently deleted.
        </p>

        <!-- Confirmation checkbox -->
        <label class="flex items-center gap-3 mb-4 cursor-pointer">
          <input
            type="checkbox"
            x-model="confirmed"
            class="w-4 h-4 rounded border-white/30 bg-white/10 accent-red-500"/>
          <span class="text-white/70 text-sm">
            I understand this cannot be undone.
          </span>
        </label>

        <form action="{{ url_for('profile.delete_account') }}" method="POST">
          <div class="mb-4">
            <label for="da_password" class="block text-sm font-medium text-white/80 mb-1">
              Confirm with Current Password
            </label>
            <input
              type="password"
              id="da_password"
              name="current_password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-2.5 bg-white/10 border border-red-500/30 rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-red-400 focus:ring-1 focus:ring-red-400"/>
          </div>
          <button
            type="submit"
            :disabled="!confirmed"
            class="px-6 py-2.5 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            Permanently Delete Account
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
