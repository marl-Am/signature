# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signature_ci
          POSTGRES_PASSWORD: signature_ci
          POSTGRES_DB: signature_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A fresh, disposable Postgres container that lives only for this
      # job — real Postgres (matching production's engine, unlike SQLite),
      # but never touches Neon or any persistent database. No secret
      # needed since nothing here is real infrastructure. Set at job level
      # so both the live Flask server ("Start application") and the
      # pytest process itself (which calls create_app() directly in
      # tests/e2e/conftest.py to write fixture rows) resolve to the same
      # database — otherwise fixtures written by one process would be
      # invisible to the other.
      DATABASE_URL: postgresql://signature_ci:signature_ci@localhost:5432/signature_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Apply database migrations
        run: flask --app wsgi:app db upgrade

      - name: Start application
        run: |
          flask --app wsgi:app run --port 5000 > flask.log 2>&1 &
          for _ in {1..30}; do
            curl -sf http://localhost:5000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Application failed to respond on port 5000 within 30 seconds"
          cat flask.log
          exit 1

      - name: Run end-to-end tests
        env:
          BASE_URL: http://localhost:5000
        run: pytest -v tests/e2e

      - name: Show application log on failure
        if: failure()
        run: cat flask.log